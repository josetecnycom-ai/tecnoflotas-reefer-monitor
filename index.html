<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Monitor de Temperatura</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
    <div id="reefer-monitor-container">
        <header>
            <h2>Estado de la Unidad de Refrigeración</h2>
        </header>
        
        <div id="content" style="padding: 10px;">
            <div id="search-container" style="margin-bottom: 15px;">
                <label for="deviceSearch">Buscar vehículo/remolque:</label><br>
                <input list="devicesList" id="deviceSearch" placeholder="Escribe para buscar..." style="width: 300px; padding: 5px;">
                <datalist id="devicesList"></datalist>
            </div>

            <button id="btn-fetch-data" class="geotabButton">Actualizar Datos</button>
            
            <div class="chart-container" style="height: 300px; width: 100%;">
                <canvas id="reeferChart"></canvas>
            </div>

            <div id="results-panel" style="margin-top: 20px;"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
