<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Monitor de Temperatura</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div id="reefer-monitor-container">
        <header>
            <h2>Estado de la Unidad de Refrigeración</h2>
        </header>
        
        <div id="content">
            <div id="selector-container" style="padding: 10px; background: #f3f4f6; border-bottom: 1px solid #ddd; margin-bottom: 10px;">
                <label for="deviceSelect">Seleccionar unidad: </label>
                <select id="deviceSelect" style="width: 250px; padding: 5px;"></select>
            </div>

            <button id="btn-fetch-data" class="geotabButton">Actualizar Datos</button>
            
            <div class="chart-container">
                <canvas id="reeferChart"></canvas>
            </div>

            <div id="results-panel">
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
