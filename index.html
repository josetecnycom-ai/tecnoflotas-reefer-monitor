<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Monitor de Temperatura</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
</head>
<body>
    <div id="reefer-monitor-container">
        <header>
            <h2>Estado de la Unidad de Refrigeración</h2>
        </header>
        
        <div id="content">
            <button id="btn-fetch-data" class="geotabButton">Actualizar Datos</button>
            
            <div id="results-panel"></div>

            <div class="chart-container" style="margin-top: 25px; position: relative; height:320px;">
                <canvas id="reeferChart"></canvas>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
